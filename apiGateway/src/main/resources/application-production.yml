# Production Profile for Cloud Deployment
spring:
  config:
    activate:
      on-profile: prod
  cloud:
    gateway:
      routes:
        - id: user-service-prod
          uri: ${USER_SERVICE_URI:http://user-service:8081}
          predicates:
            - Path=/api/auth/**, /api/users/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}
            
        - id: doctor-service-prod
          uri: ${DOCTOR_SERVICE_URI:http://doctor-service:8082}
          predicates:
            - Path=/api/doctors/**, /api/slots/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: payment-service-prod
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8080}
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: appointment-service-prod
          uri: ${APPOINTMENT_SERVICE_URI:http://appointment-service:8084}
          predicates:
            - Path=/api/appointments/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: patient-service-prod
          uri: ${PATIENT_SERVICE_URI:http://patient-service:8080}
          predicates:
            - Path=/api/patients/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

      # Global CORS configuration
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "https://clinicsliitmicroservice.netlify.app"
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO
    root: INFO
    
server:
  port: ${PORT:8080}
