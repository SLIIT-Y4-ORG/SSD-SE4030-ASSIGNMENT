spring:
  application:
    name: user-service

  datasource:
    # Supabase PostgreSQL — connection pooler (transaction mode, port 6543)
    # prepareThreshold=0  → disables server-side prepared statements (required for PgBouncer)
    # sslmode=require     → Supabase enforces SSL on all connections
    url: ${DB_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require}
    username: ${DB_USERNAME:postgres.bdgicssvyfumdnddxzbc}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  sql:
    init:
      mode: never   # data.sql is H2-only; schema managed by Hibernate ddl-auto

supabase:
  url: ${SUPABASE_URL:https://bdgicssvyfumdnddxzbc.supabase.co}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}

server:
  port: ${PORT:8081}

security:
  # Required in every environment; use a random value of at least 32 characters.
  token-secret: ${SECURITY_TOKEN_SECRET}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/callback}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://openidconnect.googleapis.com/v1/userinfo

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.userservice: INFO
    org.springframework.web: INFO
