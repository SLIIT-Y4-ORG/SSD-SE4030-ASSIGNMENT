spring:
  datasource:
    url: jdbc:h2:mem:appointmentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS appointment
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: appointment
  sql:
    init:
      mode: never

services:
  patient:
    base-url: http://localhost:18083
  doctor:
    base-url: http://localhost:18082
  user:
    base-url: http://localhost:18081
  payment:
    base-url: http://localhost:18085
    internal-api-key: test-internal-key
