server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: appointmentservice

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appointmentdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        default_schema: appointment
        format_sql: true

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  patient:
    base-url: ${PATIENT_SERVICE_URL:http://localhost:8080}
  doctor:
    base-url: ${DOCTOR_SERVICE_URL:http://localhost:8082}
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8080}
    internal-api-key: ${PAYMENT_INTERNAL_API_KEY:}
